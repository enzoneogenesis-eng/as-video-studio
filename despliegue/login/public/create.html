<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear video</title><link rel="stylesheet" href="/css/creator.css"></head><body><header><b>Studio Videos IA</b><a href="/studio">Studio</a><a href="/account">Creditos</a></header><main><p class="eyebrow">FABRICA DE VIDEOS AUTOMATIZADOS</p><h1>De una idea a un video completo</h1><label>Tema, idea o guion<textarea id="idea" placeholder="Escribi el tema o pega tu guion..."></textarea></label><div class="row"><label>Duracion<select id="minutes"><option>5</option><option selected>10</option><option>15</option><option>20</option><option>30</option><option>60</option></select></label><label>Estilo<select id="style"><option>documental</option><option>misterio</option><option>terror</option><option>historia</option><option>negocios</option><option>filosofia</option><option>ciencia</option><option>emocional</option></select></label></div><h2>Nivel de produccion</h2><section class="modes"><button data-mode="images" class="selected"><b>Imagenes</b><span>Economico</span><small>Imagenes con movimiento, voz, musica y subtitulos.</small></button><button data-mode="hybrid"><b>Hibrido</b><span>Recomendado</span><small>Imagenes mas clips animados en momentos clave.</small></button><button data-mode="animated"><b>Animado</b><span>Premium</span><small>Video IA para una experiencia visual mas dinamica.</small></button></section><section class="estimate"><div><span>Duracion</span><b id="eMinutes">--</b></div><div><span>Escenas</span><b id="eScenes">--</b></div><div><span>Imagenes</span><b id="eImages">--</b></div><div><span>Clips IA</span><b id="eClips">--</b></div><div><span>Estimado</span><b id="eCredits">--</b></div></section><button id="generate" class="generate">Crear proyecto</button><p class="note">Se confirma el coste antes de consumir creditos. Las escenas se pueden regenerar individualmente.</p></main><script src="/js/creator.js"></script></body></html>
